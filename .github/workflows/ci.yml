name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block committed env files
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' || true)
          if [ -n "$bad" ]; then
            echo "dotenv files must not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Prettier
        run: pnpm format:check

      - name: Server integration tests
        run: pnpm test:server

      - name: Build
        run: pnpm build
